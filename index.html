<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonneries - Lycée Lucie Aubrac</title>
    <link rel="stylesheet" href="CSS.css">
</head>

<body>

    <h1>Propositions de sonneries pour le lycée Lucie Aubrac</h1>

    <form id="answerForm">
        <input
            type="text"
            id="answerInput"
            placeholder="Ex : Teeth, Lady Gaga"
            required
        >
        <button type="submit">Envoyer</button>
    </form>

    <ul id="results"></ul>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            addDoc,
            getDocs,
            deleteDoc,
            doc
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAYGY37Hd7R3Jbd9BRsOMb8cw6Vpeb4d8Q",
            authDomain: "sonnerie-lycee.firebaseapp.com",
            projectId: "sonnerie-lycee"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById("answerForm");
        const input = document.getElementById("answerInput");
        const results = document.getElementById("results");

        // Pour l'instant, pas de mode administrateur.
        const isAdmin = false;

        async function displayAnswers() {
            results.innerHTML = "";

            try {
                const querySnapshot = await getDocs(
                    collection(db, "propositions")
                );

                querySnapshot.forEach((docu) => {
                    const li = document.createElement("li");

                    li.textContent = docu.data().text;

                    if (isAdmin) {
                        const deleteBtn = document.createElement("button");

                        deleteBtn.textContent = "❌";
                        deleteBtn.style.marginLeft = "10px";

                        deleteBtn.addEventListener("click", async () => {
                            try {
                                await deleteDoc(
                                    doc(db, "propositions", docu.id)
                                );

                                displayAnswers();
                            } catch (error) {
                                console.error("Erreur suppression :", error);
                                alert("Erreur lors de la suppression.");
                            }
                        });

                        li.appendChild(deleteBtn);
                    }

                    results.appendChild(li);
                });

            } catch (error) {
                console.error("Erreur chargement :", error);
                results.innerHTML =
                    "<li>Impossible de charger les propositions.</li>";
            }
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const text = input.value.trim();

            if (text === "") {
                return;
            }

            try {
                await addDoc(collection(db, "propositions"), {
                    text: text
                });

                input.value = "";
                displayAnswers();

            } catch (error) {
                console.error("Erreur ajout :", error);
                alert("Impossible d'ajouter la proposition.");
            }
        });

        displayAnswers();
    </script>

</body>
</html>
